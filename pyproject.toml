[project]
name = "kleinanzeigenbot"
version = "0.1.0"
description = "Kleinanzeigen bot project"
requires-python = "==3.13.*"   # or the version you actually use (e.g. >=3.11)
dependencies = [
    "beautifulsoup4==4.14.3",
    "black==25.11.0",
    "bs4==0.0.2",
    "isort==7.0.0",
    "pre-commit==4.5.0",
    "python-dotenv==1.2.2",
    "python-telegram-bot[job-queue]==22.6",
    "requests==2.32.5",
]



[tool.black]
line-length = 88
target-version = ["py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
